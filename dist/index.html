<head>
  <meta charset="UTF-8">

  <!-- Stylesheets -->
  <script type="module" crossorigin src="./assets/main-f-q8u13Z.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/main-CagyQ9o2.css">
</head>
<body class="xp-desktop">

  <!-- ░░ BLISS WALLPAPER CANVAS ░░ -->
  <canvas id="bliss-canvas" aria-hidden="true"></canvas>

  <!-- ░░ DESKTOP ICONS — left column ░░ -->
  <div id="desktop-icons" class="desktop-icons" aria-label="Desktop icons" role="list"></div>

  <!-- ░░ WINDOWS LAYER ░░ -->
  <div id="xp-windows-container" class="xp-windows-container" aria-live="polite"></div>

  <!-- ░░ TASKBAR ░░ -->
  <div id="xp-taskbar" class="xp-taskbar" role="toolbar" aria-label="Taskbar">

    <!-- Start button -->
    <button id="xp-start-btn" class="xp-start-btn"
            aria-haspopup="true" aria-expanded="false" aria-controls="xp-start-menu">
      <span class="start-logo" aria-hidden="true">⊞</span>
      <span class="start-text">start</span>
    </button>

    <div class="taskbar-divider" aria-hidden="true"></div>

    <!-- Open window buttons -->
    <div id="xp-taskbar-windows" class="xp-taskbar-windows" aria-label="Open windows"></div>

    <!-- System Tray -->
    <div id="xp-system-tray" class="xp-system-tray" aria-label="System tray">

      <!-- Visitor counter icon -->
      <div id="tray-visitor" class="tray-icon" title="Unique visitors">
        <span aria-hidden="true">👥</span>
        <span id="tray-visitor-count" class="tray-visitor-count" aria-live="polite">—</span>
      </div>

      <!-- World clock -->
      <div id="tray-clock" class="tray-clock" aria-label="System clock">
        <span id="tray-time">--:--</span>
        <div id="tray-clock-popup" class="tray-clock-popup" role="tooltip"></div>
      </div>

    </div>
  </div>

  <!-- ░░ START MENU (hidden by default) ░░ -->
  <div id="xp-start-menu" class="xp-start-menu" hidden role="menu" aria-label="Start menu"></div>

  <!-- ░░ BSOD OVERLAY (Shut Down easter egg) ░░ -->
  <div id="xp-bsod" class="xp-bsod" hidden aria-live="assertive" aria-atomic="true"></div>

  <!-- ░░ DESKTOP CONTEXT MENU ░░ -->
  <div id="xp-context-menu" class="xp-context-menu" hidden role="menu"></div>

  <!-- ░░ SCRIPTS ░░
       Load order: background → desktop engine → clock → visitor counter
       All are ES modules; Vite bundles + tree-shakes at build time.
  -->

</body>
</html>
